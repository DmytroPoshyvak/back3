apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-reader
  namespace: todoapp

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: role
  namespace: todoapp
rules:
  - verbs: ["get", "list"]
    resources: ["secrets"]
    apiGroups: ["v1"]

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: role
  namespace: todoapp
subjects:
  - kind: ServiceAccount
    name: secrets-reader
    namespace: todoapp
roleRef:
  kind: Role
  name: role
  apiGroup: rbac.authorization.k8s.io

